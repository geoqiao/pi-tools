packages:
  - packages/*

overrides:
  '@earendil-works/pi-agent-core@^0.84.2': 0.84.2
  '@earendil-works/pi-ai@^0.84.2': 0.84.2
  '@earendil-works/pi-tui@^0.84.2': 0.84.2
  '@earendil-works/pi-coding-agent@^0.84.2': 0.84.2

allowBuilds:
  '@google/genai': false
  lefthook: false
  protobufjs: false

# Allow fresh CI installs of the pinned Pi 1.6.0 release.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.6.0'
  - '@earendil-works/pi-ai@1.6.0'
  - '@earendil-works/pi-codemode@1.6.0'
  - '@earendil-works/pi-coding-agent@1.6.0'
  - '@earendil-works/pi-mcp@1.6.0'
  - '@earendil-works/pi-schema@1.6.0'
  - '@earendil-works/pi-telemetry@1.6.0'
  - '@earendil-works/pi-tui@1.6.0'
